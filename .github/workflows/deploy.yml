name: Deploy to VPS

on:
  push:
    branches:
      - main      # Deploy khi push vào main branch
      - master    # Hoặc master branch
  workflow_dispatch:  # Cho phép chạy manual từ GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: false  # Don't stop on non-critical errors
          script: |
            set -e  # Exit on error
            
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║           🚀 Starting Deployment to VPS                      ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            
            # Setup project directory path
            PROJECT_DIR="${PROJECT_DIR:-~/elderly-home-care-platform-backend-ai}"
            PROJECT_DIR="${PROJECT_DIR/#\~/$HOME}"  # Expand ~ to home directory
            GIT_REPO_URL="${GIT_REPO_URL:-https://github.com/${{ github.repository }}.git}"
            GIT_BRANCH="${GIT_BRANCH:-${{ github.ref_name }}}"
            
            # Check and install Docker if not present
            echo "🐳 [STEP 1/11] Checking Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "⚠️  Docker not found. Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
              rm get-docker.sh
              # Add current user to docker group (if not root)
              if [ "$USER" != "root" ]; then
                sudo usermod -aG docker $USER || true
              fi
              echo "✅ Docker installed successfully"
            else
              echo "✅ Docker is already installed"
            fi
            docker --version
            echo ""
            
            # Check and install Docker Compose if not present
            echo "🔍 [STEP 2/11] Checking Docker Compose installation..."
            if command -v docker-compose &> /dev/null; then
              DOCKER_COMPOSE="docker-compose"
            elif docker compose version &> /dev/null; then
              DOCKER_COMPOSE="docker compose"
            else
              echo "⚠️  Docker Compose not found. Installing..."
              # Install docker compose plugin
              if [ "$USER" = "root" ]; then
                mkdir -p /usr/local/lib/docker/cli-plugins
                curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
                chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              else
                sudo mkdir -p /usr/local/lib/docker/cli-plugins
                sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
                sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              fi
              DOCKER_COMPOSE="docker compose"
              echo "✅ Docker Compose installed successfully"
            fi
            echo "✅ Using: $DOCKER_COMPOSE"
            $DOCKER_COMPOSE version
            echo ""
            
            # Check Git installation
            echo "📦 [STEP 3/11] Checking Git installation..."
            if ! command -v git &> /dev/null; then
              echo "⚠️  Git not found. Installing Git..."
              if command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y git
              elif command -v yum &> /dev/null; then
                sudo yum install -y git
              else
                echo "❌ Cannot install Git automatically. Please install Git manually."
                exit 1
              fi
              echo "✅ Git installed successfully"
            else
              echo "✅ Git is already installed"
            fi
            git --version
            echo ""
            
            # Check if project directory exists, if not clone the repository
            echo "📂 [STEP 4/11] Checking project directory..."
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "⚠️  Project directory not found: $PROJECT_DIR"
              echo "📥 Cloning repository from GitHub..."
              mkdir -p "$(dirname "$PROJECT_DIR")"
              # Try to clone with SSH first, fallback to HTTPS
              if git clone "git@github.com:${{ github.repository }}.git" "$PROJECT_DIR" 2>/dev/null || \
                 git clone "$GIT_REPO_URL" "$PROJECT_DIR"; then
                echo "✅ Repository cloned successfully"
              else
                echo "❌ Failed to clone repository"
                echo "   Please ensure:"
                echo "   1. Repository is accessible (public or SSH key configured)"
                echo "   2. Git is properly installed"
                exit 1
              fi
            else
              echo "✅ Project directory exists: $PROJECT_DIR"
            fi
            echo ""
            
            # Navigate to project directory
            echo "📂 [STEP 5/11] Navigating to project directory..."
            cd "$PROJECT_DIR" || { echo "❌ Cannot access directory: $PROJECT_DIR"; exit 1; }
            echo "✅ Current directory: $(pwd)"
            echo ""
            
            # Determine current branch (if exists) or use default
            echo "🌿 [STEP 6/11] Checking Git branch..."
            if [ -d .git ]; then
              CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "$GIT_BRANCH")
              echo "✅ Current branch: $CURRENT_BRANCH"
              
              # Pull latest code from GitHub
              echo "⬇️  Pulling latest code from GitHub..."
              git fetch origin
              if git pull origin "$CURRENT_BRANCH" || git pull origin main || git pull origin master; then
                echo "✅ Code updated successfully"
              else
                echo "⚠️  Git pull failed, continuing with existing code..."
              fi
            else
              echo "⚠️  Not a git repository, skipping git operations"
            fi
            echo ""
            
            # Check for .env file
            echo "⚙️  [STEP 7/11] Checking environment configuration..."
            if [ ! -f "$PROJECT_DIR/.env" ]; then
              echo "⚠️  WARNING: .env file not found!"
              echo "   📝 Creating a template .env file..."
              echo "   ⚠️  You MUST edit .env file with your actual configuration before deployment!"
              echo ""
              echo "   Required environment variables:"
              echo "   - DB_PASSWORD"
              echo "   - REDIS_PASSWORD"
              echo "   - JWT_SECRET"
              echo "   - JWT_REFRESH_SECRET"
              echo "   - FIREBASE_KEY_BASE64 (or key_firebase.json file)"
              echo "   - MAIL_USERNAME, MAIL_PASSWORD"
              echo "   - PAYOS_* credentials"
              echo ""
              echo "   Please create .env file manually or the deployment will fail!"
              echo "   You can copy from application-local.template.yml if available."
              # Don't exit here, let user know but continue (they might have env vars set another way)
            else
              echo "✅ .env file found"
            fi
            echo ""
            
            # Backup database before deployment
            echo "💾 [STEP 8/11] Creating Database Backup..."
            BACKUP_DIR="$PWD/backups"
            mkdir -p "$BACKUP_DIR"
            echo "📁 Backup directory: $BACKUP_DIR"
            
            # Check if database container is running
            if docker ps | grep -q elderly_db; then
              BACKUP_FILE="$BACKUP_DIR/db_backup_$(date +%Y%m%d_%H%M%S).sql"
              echo "🔄 Creating backup: $(basename $BACKUP_FILE)"
              
              # Create backup using pg_dump
              if docker exec elderly_db pg_dump -U postgres elderly_platform > "$BACKUP_FILE" 2>/dev/null; then
                if [ -f "$BACKUP_FILE" ] && [ -s "$BACKUP_FILE" ]; then
                  # Compress backup to save space
                  if gzip -f "$BACKUP_FILE" 2>/dev/null; then
                    BACKUP_FILE="${BACKUP_FILE}.gz"
                    BACKUP_SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
                    echo "✅ Backup created successfully!"
                    echo "   📦 File: $(basename $BACKUP_FILE)"
                    echo "   📊 Size: $BACKUP_SIZE"
                    
                    # Keep only last 10 backups (cleanup old backups)
                    echo "🧹 Cleaning up old backups (keeping last 10)..."
                    (set +e; \
                     cd "$BACKUP_DIR" 2>/dev/null || exit 0; \
                     BACKUP_FILES=($(ls -t db_backup_*.sql.gz 2>/dev/null || true)); \
                     if [ ${#BACKUP_FILES[@]} -gt 10 ]; then \
                       REMOVE_FILES=("${BACKUP_FILES[@]:10}"); \
                       echo "   🗑️  Removing ${#REMOVE_FILES[@]} old backup(s)..."; \
                       rm -f "${REMOVE_FILES[@]}" 2>/dev/null || true; \
                       echo "   ✅ Old backups cleaned up"; \
                     else \
                       echo "   ℹ️  No old backups to remove (only ${#BACKUP_FILES[@]} backup(s))"; \
                     fi)
                  else
                    echo "⚠️  Warning: Could not compress backup"
                  fi
                else
                  echo "⚠️  Warning: Backup file is empty"
                fi
              else
                echo "⚠️  Warning: Could not create backup (database might not be accessible)"
              fi
            else
              echo "⚠️  Database container is not running, skipping backup"
            fi
            echo ""
            
            # Stop existing containers (gracefully, don't remove volumes)
            echo "🛑 [STEP 9/11] Stopping existing containers..."
            echo "   ℹ️  Note: Volumes will be preserved (database data safe)"
            if $DOCKER_COMPOSE down; then
              echo "✅ Containers stopped successfully"
            else
              echo "ℹ️  No containers were running"
            fi
            echo ""
            
            # Rebuild and start containers
            echo "🔨 [STEP 10/11] Building containers..."
            echo "   ℹ️  Building only changed services (using cache when possible)..."
            echo "   ⏳ This may take several minutes if dependencies changed..."
            if $DOCKER_COMPOSE build; then
              echo "✅ Build completed successfully"
            else
              echo "❌ Build failed!"
              exit 1
            fi
            echo ""
            
            echo "🚀 [STEP 11/11] Starting containers..."
            if $DOCKER_COMPOSE up -d; then
              echo "✅ Containers started successfully"
            else
              echo "❌ Start failed!"
              exit 1
            fi
            echo ""
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to be ready (15 seconds)..."
            sleep 15
            echo "✅ Wait completed"
            echo ""
            
            # Check container status
            echo "📊 Checking deployment status..."
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 CONTAINER STATUS"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            $DOCKER_COMPOSE ps
            echo ""
            
            # Check if all containers are running
            set +e  # Temporarily disable exit on error
            EXIT_COUNT=$($DOCKER_COMPOSE ps 2>/dev/null | grep -c "Exit" 2>/dev/null || echo "0")
            EXIT_COUNT=$(echo "$EXIT_COUNT" | tr -d '[:space:]' | head -1)
            if ! [[ "$EXIT_COUNT" =~ ^[0-9]+$ ]]; then
              EXIT_COUNT=0
            fi
            
            if [ "$EXIT_COUNT" -gt 0 ]; then
              echo "⚠️  WARNING: Some containers failed to start!"
              $DOCKER_COMPOSE ps
              echo ""
              set -e  # Re-enable exit on error
              exit 1  # Fail the deployment if containers didn't start
            else
              echo "✅ All containers are running"
              echo ""
            fi
            set -e  # Re-enable exit on error
            
            # Show recent logs
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📝 RECENT LOGS (last 30 lines)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            $DOCKER_COMPOSE logs --tail=30
            echo ""
            
            # Health check (optional - test backend endpoint)
            # ⬇️ FIXED: Don't fail script if health check fails
            echo "🏥 HEALTH CHECK"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sleep 5
            set +e  # Disable exit on error for health check
            if curl -f http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              echo "✅ Backend is responding (HTTP 200)"
            else
              echo "⚠️  Backend health check failed (might still be starting up)"
              echo "   ℹ️  This is normal - backend may need more time to initialize"
            fi
            set -e  # Re-enable exit on error
            echo ""
            
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║              ✅ DEPLOYMENT COMPLETED SUCCESSFULLY!            ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            echo "📌 Summary:"
            echo "   • Database data preserved in Docker volume"
            echo "   • All containers rebuilt and restarted"
            echo "   • Services should be accessible shortly"
            echo "   • Check logs with: docker compose logs -f"
            echo ""