# ============================================
# APPLICATION LOCAL DEVELOPMENT TEMPLATE
# ============================================
# 
# Hướng dẫn:
# 1. Copy file này thành application-local.yml:
#    cp application-local.template.yml application-local.yml
#
# 2. Điền các giá trị thật của bạn
#
# 3. File application-local.yml sẽ KHÔNG được commit lên Git
#

# ============================================
# DATABASE (Docker local)
# ============================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/elderly_platform
    username: postgres
    password: 123456789
  
  # ============================================
  # REDIS (Docker local)
  # ============================================
  data:
    redis:
      host: localhost
      port: 6379
      password: 

# ============================================
# EMAIL (Gmail SMTP)
# ============================================
# Lấy App Password từ: https://myaccount.google.com/apppasswords
  mail:
    host: smtp.gmail.com
    port: 587
    username: <your-email@gmail.com>
    password: <your-gmail-app-password>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ============================================
# JWT SECRETS
# ============================================
# Tạo random secret key: openssl rand -base64 64
jwt:
  secret: <your-jwt-secret-key-here>
  expiration: 8640000
  refresh:
    secret: <your-jwt-refresh-secret-key-here>
    expiration: 864000000

# ============================================
# PAYOS
# ============================================
# Lấy từ: https://payos.vn/
payos:
  client-id: <your-payos-client-id>
  api-key: <your-payos-api-key>
  checksum-key: <your-payos-checksum-key>
  
  # Payout
  payout-client-id: <your-payos-payout-client-id>
  payout-api-key: <your-payos-payout-api-key>
  payout-checksum-key: <your-payos-payout-checksum-key>

# ============================================
# FIREBASE
# ============================================
# Encode key file: 
# [Convert]::ToBase64String([IO.File]::ReadAllBytes("key_firebase.json"))
firebase:
  key-base64: <your-base64-encoded-firebase-key>

